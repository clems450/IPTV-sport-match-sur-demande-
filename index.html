<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma TV Sport</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #111116;
            padding: 18px 25px;
            border-bottom: 1px solid #29292f;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0;
            color: #999;
            font-size: 14px;
        }

        /* =========================
           LISTE DES MATCHS
        ========================= */

        .matchs {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        /* =========================
           CARTE MATCH
        ========================= */

        .match {
            background: #15151b;
            color: white;
            border: 1px solid #292930;
            border-radius: 14px;
            padding: 18px;
            cursor: pointer;
            transition: 0.2s;

            text-align: center;
        }

        .match:hover {
            transform: translateY(-3px);
            background: #1b1b22;
            border-color: #444;
        }

        .match.active {
            border-color: #777;
            background: #202027;
        }

        .match-date {
            color: #888;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .equipes {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .equipe {
            width: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .equipe img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .equipe span {
            font-size: 13px;
            font-weight: bold;
        }

        .vs {
            color: #777;
            font-size: 12px;
            font-weight: bold;
        }

        .regarder {
            margin-top: 18px;
            background: #292930;
            border-radius: 8px;
            padding: 9px;
            font-size: 13px;
        }

        /* =========================
           LECTEUR
        ========================= */

        .lecteur-container {
            padding: 0 20px 30px;
        }

        .lecteur-titre {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .cadre {
            width: 100%;
            height: 500px;
            overflow: hidden;
            position: relative;
            background: black;
            border-radius: 12px;
        }

        .cadre iframe {
            position: absolute;

            /* À AJUSTER SELON LA PAGE DU LECTEUR */
            top: -250px;

            left: 0;

            width: 100%;
            height: 1200px;

            border: 0;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .matchs {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            .lecteur-container {
                padding: 0 12px 20px;
            }

            .cadre {
                height: 400px;
            }

            .cadre iframe {
                height: 900px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <h1>⚽ SPORT EN DIRECT </h1>

        <p>Choisissez un match</p>

    </div>


    <!-- =========================
         LISTE DES MATCHS
    ========================= -->

    <div class="matchs">


        <!-- MATCH 1 -->
        <button class="match" onclick="changerMatch(
            'https://jack09eo.mpgreatestclgczbmiddle.my/fr/football/french-ligue-1-4441773/marseille-vs-rc-strasbourg-alsace.html?icg=UkU',
            'Marseille - Strasbourg'
        )">

            <div class="match-date">
                Aujourd'hui • 22:45
            </div>

            <div class="equipes">

                <div class="equipe">

                    <img src="marseille.png" alt="Marseille">

                    <span>Marseille</span>

                </div>

                <div class="vs">
                    VS
                </div>

                <div class="equipe">

                    <img src="strasbourg.png" alt="Strasbourg">

                    <span>Strasbourg</span>

                </div>

            </div>

            <div class="regarder">
                ▶ Regarder
            </div>

        </button>


    </div>



    <!-- =========================
         LECTEUR
    ========================= -->

    <div class="lecteur-container">

        <div class="lecteur-titre" id="titreMatch">
            Sélectionnez un match
        </div>

        <div class="cadre">

            <iframe
                id="lecteur"
                src=""
                allowfullscreen>
            </iframe>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        function changerMatch(lien, nomMatch) {

            document.getElementById("lecteur").src = lien;

            document.getElementById("titreMatch").textContent = nomMatch;

            // Retire la sélection précédente
            document.querySelectorAll(".match").forEach(function(match) {
                match.classList.remove("active");
            });

            // Sélectionne le bouton cliqué
            event.currentTarget.classList.add("active");

            // Descend automatiquement vers le lecteur
            document.querySelector(".lecteur-container").scrollIntoView({
                behavior: "smooth"
            });
        }

    </script>

</body>
</html>
