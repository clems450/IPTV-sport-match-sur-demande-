<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma TV Sport</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #0b0b0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: #111116;
            padding: 18px 25px;
            border-bottom: 1px solid #29292f;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 5px 0 0;
            color: #999;
            font-size: 14px;
        }


        /* =========================
           LISTE DES MATCHS
        ========================= */

        .matchs {
            padding: 20px;

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(260px, 1fr));

            gap: 15px;
        }


        /* =========================
           CARTE MATCH
        ========================= */

        .match {
            width: 100%;

            background: #15151b;
            color: white;

            border: 1px solid #292930;
            border-radius: 14px;

            padding: 18px;

            cursor: pointer;

            transition: 0.2s;

            text-align: center;
        }

        .match:hover {
            transform: translateY(-3px);
            background: #1b1b22;
            border-color: #555;
        }

        .match.active {
            border-color: #888;
            background: #202027;
        }


        /* =========================
           DATE
        ========================= */

        .match-date {
            color: #888;

            font-size: 12px;

            margin-bottom: 15px;
        }


        /* =========================
           EQUIPES
        ========================= */

        .equipes {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;
        }


        .equipe {

            width: 90px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;
        }


        .equipe img {

            width: 55px;
            height: 55px;

            object-fit: contain;
        }


        .equipe span {

            font-size: 13px;

            font-weight: bold;
        }


        .vs {

            color: #777;

            font-size: 12px;

            font-weight: bold;
        }


        /* =========================
           BOUTON REGARDER
        ========================= */

        .regarder {

            margin-top: 18px;

            background: #292930;

            border-radius: 8px;

            padding: 9px;

            font-size: 13px;
        }


        /* =========================
           LECTEUR
        ========================= */

        .lecteur-container {

            padding: 0 20px 30px;
        }


        .lecteur-titre {

            margin-bottom: 10px;

            font-size: 18px;

            font-weight: bold;
        }


        .cadre {

            width: 100%;

            height: 500px;

            overflow: hidden;

            position: relative;

            background: black;

            border-radius: 12px;
        }


        .cadre iframe {

            position: absolute;

            /*
                POSITION DU LECTEUR
                À MODIFIER SI BESOIN
            */

            top: -150px;

            left: 0;

            width: 100%;

            height: 1200px;

            border: 0;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .matchs {

                grid-template-columns: 1fr;

                padding: 12px;
            }


            .lecteur-container {

                padding: 0 12px 20px;
            }


            .cadre {

                height: 400px;
            }


            .cadre iframe {

                height: 800px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TITRE
    ========================= -->

    <div class="header">

        <h1>⚽ Ma TV Sport</h1>

        <p>Choisissez un match</p>

    </div>



    <!-- =========================
         LES MATCHS
         NE PAS MODIFIER LE HTML
    ========================= -->

    <div
        class="matchs"
        id="listeMatchs">
    </div>



    <!-- =========================
         LECTEUR
    ========================= -->

    <div class="lecteur-container">

        <div
            class="lecteur-titre"
            id="titreMatch">

            Sélectionnez un match

        </div>


        <div class="cadre">

            <iframe
                id="lecteur"
                src=""
                allowfullscreen>
            </iframe>

        </div>

    </div>



    <!-- =========================
         CONFIGURATION DES MATCHS
         ⭐⭐ C'EST ICI QUE TU TRAVAILLES ⭐⭐
    ========================= -->

    <script>

        const matchs = [

            /*
            =====================================
            MATCH 1
            =====================================
            */

            {
                equipe1: "Marseille",

                logo1: "marseille.png",

                equipe2: "Strasbourg",

                logo2: "strasbourg.png",

                date: "Aujourd'hui • 22:45",

                lien: "https://jack09eo.mpgreatestclgczbmiddle.my/fr/football/french-ligue-1-4441773/marseille-vs-rc-strasbourg-alsace.html?icg=UkU"
            },


            /*
            =====================================
            MATCH 2
            =====================================
            */

            {
                equipe1: "PSG",

                logo1: "psg.png",

                equipe2: "Real Madrid",

                logo2: "real.png",

                date: "Aujourd'hui • 21:00",

                lien: "https://jack09eo.mpgreatestclgczbmiddle.my/fr/football/saudi-professional-league-4456008/al-riyadh-vs-al-nassr.html?icg=UkU"
            },


            /*
            =====================================
            MATCH 3
            =====================================
            */

            {
                equipe1: "Lyon",

                logo1: "lyon.png",

                equipe2: "Manchester City",

                logo2: "city.png",

                date: "Demain • 20:45",

                lien: "LIEN_DU_MATCH_3"
            },


            /*
            =====================================
            COPIE CE BLOC POUR AJOUTER UN MATCH
            =====================================

            {
                equipe1: "Equipe 1",

                logo1: "logo1.png",

                equipe2: "Equipe 2",

                logo2: "logo2.png",

                date: "Date • Heure",

                lien: "LIEN_DU_MATCH"
            },

            */

        ];



        /* =========================
           CREATION DES CARTES
        ========================= */

        const liste = document.getElementById("listeMatchs");


        matchs.forEach((match, index) => {


            const bouton = document.createElement("button");

            bouton.className = "match";


            bouton.innerHTML = `

                <div class="match-date">

                    ${match.date}

                </div>


                <div class="equipes">


                    <div class="equipe">

                        <img
                            src="${match.logo1}"
                            alt="${match.equipe1}">

                        <span>

                            ${match.equipe1}

                        </span>

                    </div>


                    <div class="vs">

                        VS

                    </div>


                    <div class="equipe">

                        <img
                            src="${match.logo2}"
                            alt="${match.equipe2}">

                        <span>

                            ${match.equipe2}

                        </span>

                    </div>


                </div>


                <div class="regarder">

                    ▶ Regarder

                </div>

            `;


            bouton.onclick = function () {

                changerMatch(
                    match.lien,
                    match.equipe1 + " - " + match.equipe2,
                    bouton
                );

            };


            liste.appendChild(bouton);

        });



        /* =========================
           CHANGEMENT DE MATCH
        ========================= */

        function changerMatch(
            lien,
            nomMatch,
            bouton
        ) {


            document.getElementById(
                "lecteur"
            ).src = lien;


            document.getElementById(
                "titreMatch"
            ).textContent = nomMatch;


            document.querySelectorAll(
                ".match"
            ).forEach(function (match) {

                match.classList.remove(
                    "active"
                );

            });


            bouton.classList.add(
                "active"
            );


            document.querySelector(
                ".lecteur-container"
            ).scrollIntoView({

                behavior: "smooth"

            });

        }

    </script>


</body>

</html>
